name: Bug report
description: Report incorrect behavior with reproduction steps
labels: [bug]
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - api
        - web
        - deploy
        - docs
        - other
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction steps
      description: Use synthetic data only. Do not include secrets or production records.
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: Commit or version
