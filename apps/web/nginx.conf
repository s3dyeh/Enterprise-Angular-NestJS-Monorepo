map $uri $cache_policy {
  default no-store;
  ~^/.*-[A-Za-z0-9_-]+\.(js|css)$ "public, max-age=31536000, immutable";
}
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  server_tokens off;
  add_header Cache-Control $cache_policy always;
  client_max_body_size 6m;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  # Angular Material applies inline style attributes. Scripts have no unsafe-inline permission.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://www.google.com/recaptcha/ https://www.gstatic.com/recaptcha/; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.tile.openstreetmap.org; font-src 'self'; connect-src 'self' https://www.google.com/recaptcha/; frame-src https://www.google.com/recaptcha/ https://recaptcha.google.com/recaptcha/; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
  location = /health/live { access_log off; return 200 'ok'; }
  location /api/ {
    proxy_pass http://api:3001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    # Ingress must replace this header, and API trusts only this web pod's CIDR.
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_connect_timeout 3s;
    proxy_read_timeout 30s;
    proxy_send_timeout 30s;
    proxy_hide_header X-Powered-By;

  }


  location ~* \.(?:js|css|woff2|woff|ttf)$ { try_files $uri =404; }
  location / { try_files $uri $uri/ /index.html; }
}


