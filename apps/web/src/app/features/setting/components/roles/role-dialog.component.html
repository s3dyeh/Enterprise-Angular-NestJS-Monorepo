<h2 mat-dialog-title>{{ (isEdit ? 'role.edit' : 'role.create') | transloco }}</h2>
<form [formGroup]="form" (ngSubmit)="save()">
  <mat-dialog-content>
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>{{ 'list.name' | transloco }}</mat-label>
      <input matInput formControlName="name" />
      <mat-error>
        <app-error-handling [formGroup]="form" field="name" message="list.name" />
      </mat-error>
    </mat-form-field>
    <p>{{ 'list.resources' | transloco }}</p>
    <mat-selection-list formControlName="resources" multiple>
      @for (item of resources(); track item) {
        <mat-list-option [value]="item">{{ item }}</mat-list-option>
      }
    </mat-selection-list>
  </mat-dialog-content>
  <mat-dialog-actions align="end">
    <button mat-button type="button" (click)="dialog.discard()">
      {{ 'common.cancel' | transloco }}
    </button>
    <button mat-flat-button type="submit" [disabled]="form.invalid || dialog.saving()">
      {{ 'common.save' | transloco }}
    </button>
  </mat-dialog-actions>
</form>
