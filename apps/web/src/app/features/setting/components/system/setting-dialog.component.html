<h2 mat-dialog-title>{{ 'setting.edit' | transloco }}</h2>
<form [formGroup]="form" (ngSubmit)="save()">
  <mat-dialog-content>
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>{{ 'list.property' | transloco }}</mat-label>
      <input matInput formControlName="property" />
    </mat-form-field>
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>{{ 'list.value' | transloco }}</mat-label>
      <input matInput formControlName="value" />
      <mat-error>
        <app-error-handling [formGroup]="form" field="value" message="list.value" />
      </mat-error>
    </mat-form-field>
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>{{ 'list.description' | transloco }}</mat-label>
      <textarea matInput formControlName="description" rows="3"></textarea>
    </mat-form-field>
  </mat-dialog-content>
  <mat-dialog-actions align="end">
    <button mat-button type="button" (click)="dialog.discard()">
      {{ 'common.cancel' | transloco }}
    </button>
    <button mat-flat-button type="submit" [disabled]="form.invalid || dialog.saving()">
      {{ 'common.save' | transloco }}
    </button>
  </mat-dialog-actions>
</form>
