<h2 mat-dialog-title>{{ (isEdit ? 'currency.edit' : 'currency.create') | transloco }}</h2>
<form [formGroup]="form" (ngSubmit)="save()">
  <mat-dialog-content>
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>{{ 'list.name' | transloco }}</mat-label>
      <input matInput formControlName="name" />
      <mat-error>
        <app-error-handling [formGroup]="form" field="name" message="list.name" />
      </mat-error>
    </mat-form-field>
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>{{ 'list.symbol' | transloco }}</mat-label>
      <input matInput formControlName="symbol" />
      <mat-error>
        <app-error-handling [formGroup]="form" field="symbol" message="list.symbol" />
      </mat-error>
    </mat-form-field>
  </mat-dialog-content>
  <mat-dialog-actions align="end">
    <button mat-button type="button" (click)="dialog.discard()">
      {{ 'common.cancel' | transloco }}
    </button>
    <button mat-flat-button type="submit" [disabled]="form.invalid || dialog.saving()">
      {{ 'common.save' | transloco }}
    </button>
  </mat-dialog-actions>
</form>
