apiVersion: batch/v1
kind: Job
metadata:
  name: enterprise-migration
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 600
  ttlSecondsAfterFinished: 86400
  template:
    metadata: { labels: { app: enterprise-api, task: migration } }
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext: { runAsNonRoot: true, runAsUser: 1000, fsGroup: 1000, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: migration
          image: enterprise-api:local
          command: ["node", "dist/database/run-migrations.js"]
          envFrom:
            - configMapRef: { name: enterprise-config }
            - secretRef: { name: enterprise-secrets }
          resources: { requests: { cpu: 100m, memory: 256Mi }, limits: { cpu: "1", memory: 512Mi } }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }

