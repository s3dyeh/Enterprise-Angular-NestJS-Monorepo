apiVersion: v1
kind: Service
metadata:
  name: api
spec:
  selector: { app: enterprise-api }
  ports: [{ name: http, port: 3001, targetPort: http }]
---
apiVersion: v1
kind: Service
metadata:
  name: api-metrics
spec:
  clusterIP: None
  selector: { app: enterprise-api }
  ports: [{ name: http, port: 3001, targetPort: http }]
---
apiVersion: v1
kind: Service
metadata:
  name: web
spec:
  selector: { app: enterprise-web }
  ports: [{ name: http, port: 8080, targetPort: http }]

